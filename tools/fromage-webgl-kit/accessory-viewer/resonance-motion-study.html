<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Melodia P0 / Resonance Motion Study</title>
<style>
:root{--void:#080414;--ivory:#f5f0e8;--gold:#d2b878;--lav:#bbaae1;--sea:#98c2bb;--rose:#b77f83}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--void);font-family:Arial,sans-serif}.stage{position:relative;width:100vw;height:100vh;min-height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 48%,rgba(187,170,225,.13),transparent 27%),radial-gradient(circle at 50% 56%,rgba(152,194,187,.06),transparent 40%),linear-gradient(180deg,#0c071b,#080414 68%);isolation:isolate}.stage:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(245,240,232,.28) 0 .55px,transparent .75px);background-size:7px 7px;opacity:.12;mix-blend-mode:screen}.layer{position:absolute;left:50%;top:50%;width:min(64vw,690px);aspect-ratio:1;transform:translate(-50%,-50%);background-position:center;background-repeat:no-repeat;background-size:contain;pointer-events:none;will-change:transform,opacity,filter}.core{background-image:url('./resonance/resonance-core.svg');width:min(34vw,370px);opacity:0;animation:core 3.3s cubic-bezier(.2,.76,.2,1) infinite}.aperture{background-image:url('./resonance/resonance-aperture.svg');width:min(49vw,530px);opacity:0;animation:aperture 3.3s cubic-bezier(.18,.78,.18,1) infinite}.astrolabe{background-image:url('./resonance/astrolabe-arc.svg');width:min(58vw,625px);opacity:0;animation:astrolabe 3.3s cubic-bezier(.18,.78,.18,1) infinite}.orbit{background-image:url('./resonance/chromatic-orbit.svg');width:min(65vw,700px);opacity:0;animation:orbit 3.3s cubic-bezier(.18,.78,.18,1) infinite}.filigree{background-image:url('./resonance/filigree-frame.svg');width:min(73vw,790px);opacity:0;animation:filigree 3.3s cubic-bezier(.18,.78,.18,1) infinite}.object{position:absolute;left:50%;top:50%;width:min(25vw,270px);aspect-ratio:1.45;transform:translate(-50%,-50%);border:1px solid rgba(245,240,232,.18);border-radius:46% 54% 50% 50%/54% 46% 54% 46%;background:radial-gradient(ellipse at 50% 38%,rgba(245,240,232,.82),rgba(222,209,173,.46) 18%,rgba(187,170,225,.22) 40%,rgba(8,4,20,.1) 69%,transparent 75%);box-shadow:0 0 90px rgba(210,184,120,.15);opacity:0;animation:object 3.3s ease-out infinite}.label{position:absolute;left:5vw;bottom:5.3vh;color:var(--ivory);opacity:.86}.label b{display:block;font:500 clamp(11px,1vw,15px)/1.2 Arial,sans-serif;letter-spacing:.18em;color:var(--gold)}.label strong{display:block;margin-top:.55rem;font:400 clamp(28px,4.4vw,78px)/.88 Georgia,serif;letter-spacing:-.04em}.label small{display:block;margin-top:.8rem;max-width:34rem;font:400 clamp(10px,.8vw,13px)/1.5 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:rgba(245,240,232,.58)}.time{position:absolute;right:4vw;top:4vh;font:500 10px/1.4 Arial,sans-serif;letter-spacing:.16em;color:rgba(245,240,232,.45)}
@keyframes core{0%{opacity:0;transform:translate(-50%,-50%) scale(.62);filter:brightness(.8)}8%{opacity:.98;transform:translate(-50%,-50%) scale(1);filter:brightness(1.12)}70%{opacity:.92;transform:translate(-50%,-50%) scale(1)}76%{opacity:1;transform:translate(-50%,-50%) scale(1.16);filter:brightness(1.35)}85%{opacity:.92;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.28)}}
@keyframes aperture{0%,8%{opacity:0;transform:translate(-50%,-50%) rotate(-34deg) scale(.72)}26%{opacity:.92;transform:translate(-50%,-50%) rotate(0) scale(1)}72%{opacity:.82;transform:translate(-50%,-50%) rotate(8deg) scale(1)}86%{opacity:.76;transform:translate(-50%,-50%) rotate(18deg) scale(1.06)}100%{opacity:0;transform:translate(-50%,-50%) rotate(46deg) scale(1.25)}}
@keyframes astrolabe{0%,12%{opacity:0;transform:translate(-50%,-50%) rotate(46deg) scale(.86)}30%{opacity:.7;transform:translate(-50%,-50%) rotate(0) scale(1)}72%{opacity:.66;transform:translate(-50%,-50%) rotate(-18deg) scale(1)}86%{opacity:.58;transform:translate(-50%,-50%) rotate(-24deg) scale(1.04)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-52deg) scale(1.2)}}
@keyframes orbit{0%,24%{opacity:0;transform:translate(-50%,-50%) rotate(-24deg) scale(.86)}43%{opacity:.72;transform:translate(-50%,-50%) rotate(0) scale(1)}72%{opacity:.68;transform:translate(-50%,-50%) rotate(16deg) scale(1)}78%{opacity:.95;transform:translate(-50%,-50%) rotate(22deg) scale(1.04)}86%{opacity:.64;transform:translate(-50%,-50%) rotate(28deg) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(64deg) scale(1.18)}}
@keyframes filigree{0%,35%{opacity:0;transform:translate(-50%,-50%) scale(.92)}52%{opacity:.36;transform:translate(-50%,-50%) scale(1)}80%{opacity:.34;transform:translate(-50%,-50%) scale(1.01)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.32)}}
@keyframes object{0%,8%{opacity:0;transform:translate(-50%,-50%) scale(.9)}32%{opacity:.82;transform:translate(-50%,-50%) scale(1)}72%{opacity:.88;transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1.025);box-shadow:0 0 130px rgba(210,184,120,.25)}88%{opacity:.88;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.96)}}
@media(prefers-reduced-motion:reduce){.layer,.object{animation:none!important;opacity:.72}.core,.object{opacity:.9}.aperture{transform:translate(-50%,-50%) rotate(6deg)}.astrolabe{transform:translate(-50%,-50%) rotate(-14deg)}.orbit{transform:translate(-50%,-50%) rotate(12deg)}.filigree{opacity:.28}}
</style>
</head>
<body>
<main class="stage" aria-label="Melodia resonance motion study">
  <div class="layer core"></div><div class="layer aperture"></div><div class="layer astrolabe"></div><div class="layer orbit"></div><div class="layer filigree"></div><div class="object" aria-hidden="true"></div>
  <div class="label"><b>P0 / RESONANCE MOTION</b><strong>Choral Sheep<br>assembly study.</strong><small>core → aperture → astrolabe → chromatic orbit → musical hit → open transition</small></div>
  <div class="time">MELODIA · 3.3s LOOP · REEL 70%</div>
</main>
</body>
</html>
