<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Redirecting — Brennan Shepherd Portfolio</title>
<script>
  // Dynamic 404 Auto-Redirect for GitHub Pages:
  // If user visits /my-site/some-page.html, redirect to /my-site/wix/some-page.html
  (function() {
    var path = window.location.pathname;
    if (!path.includes('/wix/')) {
      var segments = path.split('/');
      var filename = segments[segments.length - 1];
      if (filename && filename.endsWith('.html')) {
        var target = path.replace(filename, 'wix/' + filename);
        window.location.replace(target + window.location.search + window.location.hash);
        return;
      }
    }
  })();
</script>
<meta http-equiv="refresh" content="0; url=wix/index.html" />
<style>
  html, body { margin: 0; min-height: 100%; background: #08080c; color: #eed08d; font-family: sans-serif; display: grid; place-items: center; }
  a { color: #88e5ff; }
</style>
</head>
<body>
  <p>Redirecting to <a href="wix/index.html">Brennan Shepherd Portfolio</a>...</p>
</body>
</html>
