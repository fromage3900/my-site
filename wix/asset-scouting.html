<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: http://127.0.0.1:* ws://127.0.0.1:*; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:;" />
<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>Asset Scouting</title>
<link rel="stylesheet" href="melodia-luxury-type.css">
<style>
  :root { --surface-base: var(--primitive-astral-900); --text-primary: var(--primitive-ivory-50); --text-secondary: var(--primitive-slate-300); --gold: var(--primitive-gold-500); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-body), system-ui, sans-serif; background: var(--surface-base); color: var(--text-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { max-width: 640px; text-align: center; border: 1px solid rgba(201,168,106,0.2); border-radius: 12px; padding: 3rem 2rem; }
  h1 { color: var(--gold); font-size: 1.6rem; margin-bottom: 1rem; }
  p { color: var(--text-secondary); line-height: 1.6; }
  .badge { display: inline-block; margin-top: 1.5rem; padding: 0.4rem 1rem; border: 1px solid var(--gold); border-radius: 999px; font-size: 0.75rem; color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="card">
  <h1>Asset Scouting</h1>
  <p>Asset scouting dashboard — marketplace research, style alignment analysis, and production-ready asset recommendations.  curated asset references and scouting reports.</p>
  <span class="badge">In Progress</span>
</div>
</body>
</html>
