<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Melodia Living Worlds</title>
  <desc id="desc">A dreamlike rose mountain opens a distant eye beneath an impossible sea, with a luminous tear river and golden ribs.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141A30"/>
      <stop offset=".48" stop-color="#241B2E"/>
      <stop offset="1" stop-color="#0A0E1C"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#F5E8EA" stop-opacity=".7"/>
      <stop offset=".35" stop-color="#D6A9B0" stop-opacity=".26"/>
      <stop offset="1" stop-color="#6E5AA6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountain" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#D6A9B0"/>
      <stop offset=".44" stop-color="#6E6080"/>
      <stop offset="1" stop-color="#241B2E"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8ECD6"/>
      <stop offset=".35" stop-color="#8FC9BD"/>
      <stop offset="1" stop-color="#3C5C9E" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="skySea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FC9BD" stop-opacity=".68"/>
      <stop offset="1" stop-color="#3C5C9E" stop-opacity=".05"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="19" r="1" fill="#FFF8EE" opacity=".18"/>
      <circle cx="41" cy="74" r=".7" fill="#FFF8EE" opacity=".12"/>
      <circle cx="91" cy="31" r="1.2" fill="#C2BAE0" opacity=".16"/>
      <circle cx="113" cy="102" r=".8" fill="#C9A86A" opacity=".2"/>
      <circle cx="64" cy="7" r=".6" fill="#FFF8EE" opacity=".1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#night)"/>
  <ellipse cx="810" cy="420" rx="610" ry="430" fill="url(#halo)"/>
  <path d="M0 0h1600v194c-172 52-298-19-458 16-179 39-338 112-531 59C411 214 241 127 0 201Z" fill="url(#skySea)"/>
  <g fill="none" stroke="#F8ECD6" stroke-opacity=".23">
    <path d="M0 124c203 64 307-35 508 14s337 100 541 31 348-8 551 34"/>
    <path d="M0 165c183 55 343-8 512 32s334 66 522 9 353-9 566 44"/>
    <path d="M0 76c222 43 338-23 510 11s317 76 511 15 369-12 579 29"/>
  </g>

  <g opacity=".55" fill="none" stroke="#C9A86A" stroke-width="8">
    <path d="M257 676c4-217 91-337 211-337s202 120 206 337"/>
    <path d="M926 687c4-239 101-371 233-371s222 132 226 371"/>
  </g>
  <g opacity=".2" fill="none" stroke="#F0E6D2" stroke-width="2">
    <path d="M290 673c3-185 76-286 178-286s172 101 175 286"/>
    <path d="M963 684c3-202 84-313 196-313s188 111 191 313"/>
  </g>

  <path d="M178 760c91-165 172-244 263-255 62-8 111 29 165 7 83-35 105-192 213-205 114-13 156 166 242 193 90 28 149-41 231 6 72 42 115 132 151 254Z" fill="url(#mountain)"/>
  <path d="M290 750c70-151 120-198 188-212 65-14 98 15 154-4 72-24 109-142 180-158 83-19 117 107 193 152 69 41 126 14 197 43 61 25 106 82 139 179Z" fill="none" stroke="#F5E8EA" stroke-opacity=".12" stroke-width="3"/>

  <g transform="translate(812 432)">
    <ellipse rx="152" ry="76" fill="#F5E8EA" opacity=".68" filter="url(#glow)"/>
    <ellipse rx="145" ry="68" fill="#1C1426"/>
    <ellipse rx="62" ry="62" fill="#8FC9BD"/>
    <ellipse rx="30" ry="58" fill="#05050D"/>
    <circle cx="-19" cy="-20" r="9" fill="#FFF8EE" opacity=".85"/>
    <path d="M-177 1Q0-111 177 1" fill="none" stroke="#C9A86A" stroke-width="9"/>
    <path d="M-177 3Q0 112 177 3" fill="none" stroke="#C9A86A" stroke-width="7" opacity=".76"/>
  </g>

  <path d="M812 493c-28 91-92 136-58 210 21 45 7 108-48 197h229c-81-98-76-153-42-208 44-72-49-122-81-199Z" fill="url(#river)" opacity=".88" filter="url(#glow)"/>
  <g fill="#F8ECD6" filter="url(#glow)">
    <circle cx="757" cy="287" r="5"/><circle cx="1095" cy="222" r="4"/>
    <circle cx="1318" cy="386" r="3"/><circle cx="394" cy="294" r="4"/>
    <path d="m1165 485 8 17 17 8-17 8-8 17-8-17-17-8 17-8Z"/>
    <path d="m496 436 6 13 13 6-13 6-6 13-6-13-13-6 13-6Z"/>
  </g>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <rect x="38" y="38" width="1524" height="824" rx="8" fill="none" stroke="#C9A86A" stroke-opacity=".38"/>
  <path d="M76 82h176M1348 82h176M76 818h176M1348 818h176" stroke="#C9A86A" stroke-width="2" opacity=".65"/>

  <g fill="#FFF8EE">
    <text x="82" y="116" font-family="Segoe UI, sans-serif" font-size="18" letter-spacing="7" opacity=".78">MELODIA / MELUSINA</text>
    <text x="80" y="738" font-family="Georgia, serif" font-size="94" letter-spacing="-3">LIVING WORLDS</text>
    <text x="84" y="786" font-family="Segoe UI, sans-serif" font-size="18" letter-spacing="4" opacity=".72">THREE PROCEDURAL DREAMSCAPES · ONE LANDSCAPE THAT LOOKS BACK</text>
  </g>
  <text x="1518" y="784" text-anchor="end" fill="#C9A86A" font-family="Segoe UI, sans-serif" font-size="17" letter-spacing="3">FIELD STUDY 01—03</text>
</svg>
