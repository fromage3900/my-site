name: One-time restore of upstream Mixamo Soldier GLB
on:
  push:
    branches: [release/resonant-wilds-v15-canonical-20261112]
    paths:
      - 'resonant-wilds/**'
      - '.github/workflows/restore-resonant-wilds-mixamo.yml'
permissions:
  contents: write
jobs:
  import-verified-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact canonical GLB from licensed three.js examples
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error \
            https://raw.githubusercontent.com/mrdoob/three.js/r170/examples/models/gltf/Soldier.glb \
            --output resonant-wilds/assets/models/mixamo-hero.glb
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('resonant-wilds/assets/models/mixamo-hero.glb')
          b=p.read_bytes()
          assert len(b)==2160468, f'unexpected Soldier GLB size {len(b)}'
          assert b[:4]==b'glTF', 'not a GLB binary'
          sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\x00'+b).hexdigest()
          assert sha=='1788f122d03bec6c3c634e7625e6cdfa960eef49', f'canonical SHA mismatch: {sha}'
          print('PASS exact source Soldier GLB:',sha)
          PY
      - name: Commit the single asset and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- resonant-wilds/assets/models/mixamo-hero.glb
          git rm -- .github/workflows/restore-resonant-wilds-mixamo.yml
          git diff --cached --check
          git commit -m "asset(web): restore exact upstream Mixamo Soldier GLB, retire importer"
          git push origin HEAD:release/resonant-wilds-v15-canonical-20261112
