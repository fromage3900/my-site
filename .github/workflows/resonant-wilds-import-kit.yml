name: One-time Resonant Wilds GLB asset intake
on:
  push:
    branches: [rw-harmonic-grove-glb]
    paths:
      - .github/workflows/resonant-wilds-import-kit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-harmonic-grove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download immutable Higgsfield export and validate binary
        shell: bash
        env:
          RW_EXPORT_URL: 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/3456ae12-564a-4a28-9b31-a209f6c3075f/revisions/00000001-harmonic-grove-build-master-v2/preview.glb?X-Amz-Expires=900&X-Amz-Date=20261028T033457Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20261028%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=23bdf99c6baf9044f20fbfa8ad6542899b384f85f19cde75bb27d2f0bf475fd5'
        run: |
          set -euo pipefail
          mkdir -p resonant-wilds/assets/models
          curl --fail --location --retry 2 --silent --show-error "$RW_EXPORT_URL" -o resonant-wilds/assets/models/harmonic-grove-37.glb
          python - <<'PY'
          from pathlib import Path
          import struct
          p=Path('resonant-wilds/assets/models/harmonic-grove-37.glb')
          data=p.read_bytes()
          assert data[:4]==b'glTF', 'GLB magic header missing'
          version,length=struct.unpack_from('<II',data,4)
          assert version == 2 and length == len(data), (version,length,len(data))
          assert 250000 < len(data) < 4000000, 'Unexpected asset pack size'
          print('GLB validated:',len(data),'bytes')
          PY
      - name: Commit permanent binary asset and remove temporary intake workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resonant-wilds/assets/models/harmonic-grove-37.glb
          git rm .github/workflows/resonant-wilds-import-kit.yml
          git commit -m 'Add immutable 37-piece Harmonic Grove GLB asset pack'
          git push origin HEAD:rw-harmonic-grove-glb
