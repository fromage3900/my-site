name: Temporary accessory image rebuild

on:
  push:
    branches:
      - art/accessory-editorial-gn-studies

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/accessory-editorial-gn-studies
          fetch-depth: 0

      - name: Rebuild exact JPEG previews
        shell: bash
        run: |
          set -euo pipefail
          out='tools/fromage-webgl-kit/accessory-viewer/design'
          mkdir -p "$out"
          cat .tmp-eyewear-b64/modern.part* | base64 -d > "$out/editorial_eyewear_modern.jpg"
          cat .tmp-eyewear-b64/romantic.part* | base64 -d > "$out/editorial_eyewear_romantic.jpg"
          file "$out/editorial_eyewear_modern.jpg"
          file "$out/editorial_eyewear_romantic.jpg"
          python - <<'PY'
          from pathlib import Path
          expected = {
              'tools/fromage-webgl-kit/accessory-viewer/design/editorial_eyewear_modern.jpg': 17699,
              'tools/fromage-webgl-kit/accessory-viewer/design/editorial_eyewear_romantic.jpg': 18279,
          }
          for name, size in expected.items():
              data = Path(name).read_bytes()
              assert len(data) == size, (name, len(data), size)
              assert data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9', name
              print(f'{name}: JPEG markers + byte size OK ({size})')
          PY

      - name: Commit repaired previews and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fromage-webgl-kit/accessory-viewer/design/editorial_eyewear_modern.jpg
          git add tools/fromage-webgl-kit/accessory-viewer/design/editorial_eyewear_romantic.jpg
          git rm -r .tmp-eyewear-b64
          git rm .github/workflows/_temp_accessory_image_rebuild.yml
          git commit -m 'fix(accessory): rebuild exact editorial eyewear previews'
          git push origin HEAD:art/accessory-editorial-gn-studies
