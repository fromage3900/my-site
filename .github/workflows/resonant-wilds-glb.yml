name: Resonant Wilds GLB integration gates
on:
  push:
    branches: [main]
    paths:
      - 'resonant-wilds/**'
      - '.github/workflows/resonant-wilds-glb.yml'
  pull_request:
    paths:
      - 'resonant-wilds/**'
      - '.github/workflows/resonant-wilds-glb.yml'
permissions:
  contents: read
jobs:
  check-glb-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check 100 authored Grove assets, Nikki saves, Floraison and release hashes
        run: |
          node resonant-wilds/tools/check_grove_kit.mjs
          node resonant-wilds/tools/check_grove_integration.mjs
          node resonant-wilds/tools/check_release_staging.mjs
      - name: Verify website-only gallery and real PWA icons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('resonant-wilds')
          html=(root/'asset-gallery.html').read_text()
          gallery=(root/'js/asset-gallery.js').read_text()
          assert 'type="importmap"' in html and './js/asset-gallery.js' in html
          assert 'loadHarmonicGrove' in gallery and 'GROVE_KIT03_NAMES' in gallery
          assert (root/'js/harmonic-grove.js').is_file()
          for n in [192, 512]:
              raw=(root/f'icon-{n}.png').read_bytes()
              assert raw[:8] == bytes((137,80,78,71,13,10,26,10)), 'PWA icon corrupt'
          assert 'resonant-wilds-v15-20261029-floraison-release' in (root/'sw.js').read_text()
          print('PASS gallery + real PNG icons + SW v15')
          PY
      - name: Verify independent SFX/music and browser intake contracts
        run: |
          node resonant-wilds/tools/test_audio_routing.mjs
          node resonant-wilds/tools/check_cloud_intake.mjs
