name: Resonant Wilds GLB integration gates
on:
  push:
    branches: [main, rw-harmonic-grove-glb]
    paths:
      - 'resonant-wilds/**'
      - '.github/workflows/resonant-wilds-glb.yml'
  pull_request:
    paths:
      - 'resonant-wilds/**'
permissions:
  contents: read
jobs:
  check-glb-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check authored GLB binary and all 37 root anchors
        shell: bash
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path
          p = Path('resonant-wilds/assets/models/harmonic-grove-37.glb')
          raw = p.read_bytes()
          assert raw[:4] == b'glTF', 'Not a GLB file'
          version, total = struct.unpack_from('<II', raw, 4)
          assert version == 2 and total == len(raw)
          length, chunk_type = struct.unpack_from('<II', raw, 12)
          assert chunk_type == 0x4E4F534A, 'Missing GLB JSON chunk'
          data = json.loads(raw[20:20+length])
          anchors = [n.get('name', '') for n in data.get('nodes',[]) if n.get('name','').startswith('ASSET_')]
          assert len(set(anchors)) == 37, f'Expected 37 unique roots, got {len(set(anchors))}: {anchors}'
          assert data.get('meshes'), 'Missing kit meshes'
          print(f'PASS GLB: {len(raw)} bytes, {len(anchors)} asset anchors, {len(data["meshes"])} meshes, {len(data.get("materials",[]))} materials')
          PY
      - name: Validate all 100 Harmonic Grove prefabs and standalone GLBs
        shell: bash
        run: |
          python - <<'PY'
          import json, re, struct
          from pathlib import Path
          models = Path('resonant-wilds/assets/models')
          source = Path('resonant-wilds/js/harmonic-grove.js').read_text()
          count = 37
          for kit, expected in [(2, 32), (3, 31)]:
              marker = f'export const GROVE_KIT0{kit}_NAMES = Object.freeze(['
              assert marker in source, f'Missing Kit {kit} manifest'
              body = source.split(marker, 1)[1].split(']);', 1)[0]
              names = re.findall(r'"([A-Z]+_[^"]+)"', body)
              assert len(names) == expected and len(set(names)) == expected, f'Kit {kit}: {len(names)} names'
              for name in names:
                  p = models / (name.lower() + '.glb')
                  raw = p.read_bytes()
                  assert raw[:4] == b'glTF', f'Bad GLB signature: {p}'
                  version, declared_size = struct.unpack_from('<II', raw, 4)
                  assert version == 2 and declared_size == len(raw), f'Corrupt GLB header: {p}'
                  json_len, chunk_type = struct.unpack_from('<II', raw, 12)
                  assert chunk_type == 0x4e4f534a, f'Missing JSON chunk: {p}'
                  document = json.loads(raw[20:20 + json_len])
                  assert document.get('meshes'), f'Empty GLB: {p}'
                  assert any(n.get('name') == 'ASSET_' + name for n in document.get('nodes', [])), f'Pivot/root missing: {p}'
              count += len(names)
          assert count == 100, f'Expected 100 total prefab names, got {count}'
          standalone = {p.name for p in models.glob('*.glb')}
          assert len(standalone) == 65, f'Expected 1 master + 63 grove GLBs + shrine GLB: {len(standalone)}'
          assert 'resonance-shrine.glb' in standalone, 'Optional Higgsfield shrine GLB absent'
          print(f'PASS: {count} grove prefabs + 1 optional shrine across {len(standalone)} GLB files')
          PY
      - name: Check Three.js module syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in resonant-wilds/js/harmonic-grove.js resonant-wilds/js/world.js resonant-wilds/js/game.js resonant-wilds/js/activities.js resonant-wilds/js/asset-gallery.js resonant-wilds/sw.js resonant-wilds/vendor/loaders/GLTFLoader.js resonant-wilds/vendor/utils/BufferGeometryUtils.js; do
            node --input-type=module --check < "$f"
          done
      - name: Test independent SFX/music volume and ambient routing
        run: |
          node --check resonant-wilds/js/audio.js
          node resonant-wilds/tools/test_audio_routing.mjs
      - name: Check optional prefab landmarks preserve gameplay state
        shell: bash
        run: node resonant-wilds/tools/test_grove_landmark_dressing.mjs
      - name: Verify review gallery routes to canonical GLBs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('resonant-wilds/asset-gallery.html').read_text()
          js = Path('resonant-wilds/js/asset-gallery.js').read_text()
          sw = Path('resonant-wilds/sw.js').read_text()
          assert 'type="importmap"' in html and './js/asset-gallery.js' in html
          assert 'loadHarmonicGrove' in js and 'GROVE_KIT03_NAMES' in js
          assert 'resonant-wilds-v9-100-npr-heritage' in sw
          print('PASS: standalone review gallery, import map and PWA version')
          PY
      - name: Smoke test actual game with streamed GLBs in Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME" || { echo "Chrome missing"; exit 1; }
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/rw-smoke-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          timeout 95s "$CHROME" --headless=new --no-sandbox \
            --disable-dev-shm-usage --disable-background-networking \
            --disable-default-apps --disable-extensions --disable-sync \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader \
            --virtual-time-budget=65000 --window-size=900,700 \
            --dump-dom 'http://127.0.0.1:4173/resonant-wilds/tools/qa_glb_browser.html' \
            > /tmp/rw-browser-dom.html 2> /tmp/rw-browser-chrome.log || {
              tail -50 /tmp/rw-browser-chrome.log
              tail -30 /tmp/rw-browser-dom.html
              exit 1
            }
          if ! grep -q 'data-result="pass"' /tmp/rw-browser-dom.html; then
            echo 'Browser startup/full-GLB load did not pass'
            grep -E 'data-result=|Game loading:|GLBs|Timeout' /tmp/rw-browser-dom.html | tail -15 || true
            tail -40 /tmp/rw-browser-chrome.log
            exit 1
          fi
          echo "PASS: Chromium launched the real game and loaded all 100 prefabs"
      - name: Verify offline asset intake and import map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          sw=Path('resonant-wilds/sw.js').read_text()
          html=Path('resonant-wilds/index.html').read_text()
          kit=Path('resonant-wilds/js/harmonic-grove.js').read_text()
          assert 'harmonic-grove-37.glb' in sw and 'GLTFLoader.js' in sw
          assert 'three.module.min.js' in html
          assert "from '../vendor/loaders/GLTFLoader.js'" in kit
          assert "await import('./harmonic-grove.js')" in Path('resonant-wilds/js/game.js').read_text()
          print('PASS static wiring')
          PY
