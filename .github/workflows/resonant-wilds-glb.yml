name: Resonant Wilds GLB integration gates
on:
  push:
    branches: [main, rw-harmonic-grove-glb]
    paths:
      - 'resonant-wilds/**'
      - '.github/workflows/resonant-wilds-glb.yml'
  pull_request:
    paths:
      - 'resonant-wilds/**'
permissions:
  contents: read
jobs:
  check-glb-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check authored GLB binary and all 37 root anchors
        shell: bash
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path
          p = Path('resonant-wilds/assets/models/harmonic-grove-37.glb')
          raw = p.read_bytes()
          assert raw[:4] == b'glTF', 'Not a GLB file'
          version, total = struct.unpack_from('<II', raw, 4)
          assert version == 2 and total == len(raw)
          length, chunk_type = struct.unpack_from('<II', raw, 12)
          assert chunk_type == 0x4E4F534A, 'Missing GLB JSON chunk'
          data = json.loads(raw[20:20+length])
          anchors = [n.get('name', '') for n in data.get('nodes',[]) if n.get('name','').startswith('ASSET_')]
          assert len(set(anchors)) == 37, f'Expected 37 unique roots, got {len(set(anchors))}: {anchors}'
          assert data.get('meshes'), 'Missing kit meshes'
          print(f'PASS GLB: {len(raw)} bytes, {len(anchors)} asset anchors, {len(data["meshes"])} meshes, {len(data.get("materials",[]))} materials')
          PY
      - name: Validate all 100 Harmonic Grove prefabs and standalone GLBs
        shell: bash
        run: |
          python - <<'PY'
          import json, re, struct
          from pathlib import Path
          models = Path('resonant-wilds/assets/models')
          source = Path('resonant-wilds/js/harmonic-grove.js').read_text()
          count = 37
          for kit, expected in [(2, 32), (3, 31)]:
              pattern = r'export const GROVE_KIT0' + str(kit) + r'_NAMES = Object.freeze\\(\\[([\\s\\S]*?)\\]\\);'
              match = re.search(pattern, source)
              assert match, f'Missing Kit {kit} manifest'
              names = re.findall(r'"([A-Z]+_[^"]+)"', match.group(1))
              assert len(names) == expected and len(set(names)) == expected, f'Kit {kit}: {len(names)} names'
              for name in names:
                  p = models / (name.lower() + '.glb')
                  raw = p.read_bytes()
                  assert raw[:4] == b'glTF', f'Bad GLB signature: {p}'
                  version, declared_size = struct.unpack_from('<II', raw, 4)
                  assert version == 2 and declared_size == len(raw), f'Corrupt GLB header: {p}'
                  json_len, chunk_type = struct.unpack_from('<II', raw, 12)
                  assert chunk_type == 0x4e4f534a, f'Missing JSON chunk: {p}'
                  document = json.loads(raw[20:20 + json_len])
                  assert document.get('meshes'), f'Empty GLB: {p}'
                  assert any(n.get('name') == 'ASSET_' + name for n in document.get('nodes', [])), f'Pivot/root missing: {p}'
              count += len(names)
          assert count == 100, f'Expected 100 total prefab names, got {count}'
          standalone = list(models.glob('*.glb'))
          assert len(standalone) == 64, f'Expected 1 master + 63 standalone GLBs: {len(standalone)}'
          print(f'PASS: {count} prefabs across 64 GLB files')
          PY
      - name: Check Three.js module syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in resonant-wilds/js/harmonic-grove.js resonant-wilds/js/world.js resonant-wilds/js/game.js resonant-wilds/js/activities.js resonant-wilds/vendor/loaders/GLTFLoader.js resonant-wilds/vendor/utils/BufferGeometryUtils.js; do
            node --input-type=module --check < "$f"
          done
      - name: Verify offline asset intake and import map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          sw=Path('resonant-wilds/sw.js').read_text()
          html=Path('resonant-wilds/index.html').read_text()
          kit=Path('resonant-wilds/js/harmonic-grove.js').read_text()
          assert 'harmonic-grove-37.glb' in sw and 'GLTFLoader.js' in sw
          assert 'three.module.min.js' in html
          assert "from '../vendor/loaders/GLTFLoader.js'" in kit
          assert "await import('./harmonic-grove.js')" in Path('resonant-wilds/js/game.js').read_text()
          print('PASS static wiring')
          PY
