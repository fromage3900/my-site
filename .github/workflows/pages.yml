name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate assets & portfolio
    runs-on: ubuntu-latest
    outputs:
      wix_enabled: ${{ steps.check_wix.outputs.wix_enabled }}
      is_latest: ${{ steps.check_latest.outputs.is_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check whether this run is current main
        id: check_latest
        shell: bash
        run: |
          git fetch origin main --quiet
          latest="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" = "$latest" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Stale run: $GITHUB_SHA; current main: $latest"
          fi
      - name: Check Wix API key availability
        id: check_wix
        run: |
          if [ -n "$WIX_API_KEY" ]; then
            echo "wix_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "wix_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Optional Wix project publish skipped: WIX_CLI_API_KEY is not configured. The public portfolio iframe still updates from the successful GitHub Pages deploy."
          fi
        env:
          WIX_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build responsive art derivatives
        run: |
          python -m pip install pillow
          python tools/build_curated_art_derivatives.py
      - name: Validate assets (tiered)
        run: python tools/validate_assets.py
      - name: Validate core JavaScript syntax
        run: |
          node --check wix/wix-entry-bootstrap.js
          node --check wix/melodia-site-nav.js
          node --check wix/melodia-editorial.js
          node --check wix/melodia-mahou-flourish.js
          node --check wix/melodia-starfield.js
          node --check wix/melodia-site-nav.js
          node --check wix/melodia-dream-shaders.js
          node --check wix/premium-cosmic-hero.js
          node --check wix/curated-art-viewer.js
          node --check wix/pigment-memory.js
      - name: Token discipline (blocking)
        # BLOCKING as of 2026-09-10. This ran advisory for one day while the palette
        # naming pass was in flight; lint:tokens now reports 0 hard errors and exits 0.
        # 1309 soft warnings remain (raw rgba literals, missing --space-* tokens) but the
        # linter does not fail on those. Do not re-add continue-on-error: the point of
        # this step is that CI and `npm run verify:all` agree on what green means.
        run: node tools/lint-tokens.js
      - name: Validate portfolio (links + JSON)
        shell: pwsh
        run: ./tools/validate_portfolio.ps1
      - name: Validate recruiter showcase polish
        run: python tools/verify_showcase_polish.py
      - name: Validate recruiter sendoff freeze
        run: python tools/verify_sendoff_freeze.py

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: validate
    if: needs.validate.outputs.is_latest == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build responsive art derivatives
        run: |
          python -m pip install pillow
          python tools/build_curated_art_derivatives.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-wix:
    name: Publish Wix project (optional)
    needs: validate
    if: needs.validate.outputs.wix_enabled == 'true' && needs.validate.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    env:
      WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build responsive art derivatives
        run: |
          python -m pip install pillow
          python tools/build_curated_art_derivatives.py
      - name: Install Wix CLI for Sites
        run: npm ci
      - name: Authenticate Wix CLI for Sites
        run: npx wix login --api-key "$WIX_CLI_API_KEY"
      - name: Publish default branch to Wix
        env:
          CI: "true"
        run: npx wix publish

  visual-qa-snapshots:
    name: Capture visual QA snapshots
    needs: validate
    if: needs.validate.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build responsive art derivatives
        run: |
          python -m pip install pillow
          python tools/build_curated_art_derivatives.py
      - name: Build current render comparison boards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont

          out = Path("visual-qa")
          out.mkdir(exist_ok=True)
          root = Path("public/melodia/melusina-morning-vfx/2026-09-17/heroes")
          renders = [
              ("TD01 Siren Harp / Bow", root / "11_TD_01_hero_02_siren_harp_bow_master.png"),
              ("TD02 Choral Sheep Anime Pasture", root / "11_TD_02_hero_01_choral_sheep_anime_pasture.png"),
              ("TD03 Water Sanctuary", root / "11_TD_03_hero_03_melusina_water_sanctuary_master.png"),
              ("TD04 Escher Sanctuary", root / "11_TD_04_hero_04_escher_sanctuary_master.png"),
              ("TD05 Choral Sheep Pasture", root / "11_TD_05_hero_01_choral_sheep_pasture_master.png"),
              ("TD06 Siren Harp / Bow PBR", root / "11_TD_06_hero_02_siren_harp_bow_pbr_tracked.png"),
          ]

          font = ImageFont.load_default()
          bg = (10, 14, 34)
          paper = (255, 248, 238)
          gold = (201, 168, 106)

          def label(draw, xy, text):
              x, y = xy
              draw.rectangle((x, y, x + 470, y + 25), fill=bg)
              draw.text((x + 8, y + 6), text, font=font, fill=paper)

          # Original 16:9 masters — no crop.
          sheet = Image.new("RGB", (1440, 640), bg)
          draw = ImageDraw.Draw(sheet)
          for idx, (name, path) in enumerate(renders):
              im = Image.open(path).convert("RGB")
              thumb = ImageOps.contain(im, (460, 270))
              col, row = idx % 3, idx // 3
              x, y = col * 480 + 10, row * 320 + 10
              sheet.paste(thumb, (x, y + 28))
              label(draw, (x, y), name)
          sheet.save(out / "td-master-contact-sheet.png", quality=95)

          # Portrait-cover simulation for the Selected Art / mobile hero.
          crop_sheet = Image.new("RGB", (840, 1120), bg)
          draw = ImageDraw.Draw(crop_sheet)
          for idx, (name, path) in enumerate(renders):
              im = Image.open(path).convert("RGB")
              crop = ImageOps.fit(im, (260, 500), method=Image.Resampling.LANCZOS, centering=(0.5, 0.45))
              col, row = idx % 3, idx // 3
              x, y = col * 280 + 10, row * 560 + 10
              crop_sheet.paste(crop, (x, y + 28))
              draw.rectangle((x, y, x + 260, y + 25), fill=bg)
              draw.text((x + 6, y + 6), name, font=font, fill=paper)
          crop_sheet.save(out / "td-mobile-center-crops.png", quality=95)
          PY
      - name: Capture recruiter surfaces
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary available on runner"
            exit 1
          fi

          mkdir -p visual-qa
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/melodia-visual-qa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 1

          capture() {
            local width="$1"
            local height="$2"
            local output="$3"
            local route="$4"
            local target="$PWD/visual-qa/$output"
            set +e
            timeout 25s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-default-apps --disable-extensions --disable-sync --hide-scrollbars --mute-audio --window-size="$width,$height" --screenshot="$target" "http://127.0.0.1:4173/$route"
            local code=$?
            set -e
            if [ ! -s "$target" ]; then
              echo "Screenshot failed for $route ($width x $height), exit=$code"
              return "$code"
            fi
            if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
              return "$code"
            fi
          }

          capture 390 844 homepage-390.png wix/index.html?capture=1
          capture 430 932 homepage-430.png wix/index.html?capture=1
          capture 1440 1100 homepage-1440.png wix/index.html?capture=1

          capture 390 1800 selected-art-390.png wix/curated-art.html
          capture 1440 1500 selected-art-1440.png wix/curated-art.html

          capture 390 1200 artifact-ui-390.png wix/application-hub.html?capture=artifact
          capture 1440 1100 artifact-ui-1440.png wix/application-hub.html?capture=artifact
      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-snapshots-${{ github.sha }}
          path: visual-qa/*.png
          if-no-files-found: error
          retention-days: 3
