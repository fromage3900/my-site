name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate assets & portfolio
    runs-on: ubuntu-latest
    outputs:
      wix_enabled: ${{ steps.check_wix.outputs.wix_enabled }}
      is_latest: ${{ steps.check_latest.outputs.is_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check whether this run is current main
        id: check_latest
        shell: bash
        run: |
          git fetch origin main --quiet
          latest="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" = "$latest" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Stale run: $GITHUB_SHA; current main: $latest"
          fi
      - name: Check Wix token availability
        id: check_wix
        run: |
          if [ -n "$WIX_TOKEN" ]; then
            echo "wix_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "wix_enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          WIX_TOKEN: ${{ secrets.WIX_CLI_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build responsive art derivatives
        run: |
          python -m pip install pillow
          python tools/build_curated_art_derivatives.py
      - name: Validate assets (tiered)
        run: python tools/validate_assets.py
      - name: Validate core JavaScript syntax
        run: |
          node --check wix/wix-entry-bootstrap.js
          node --check wix/melodia-site-nav.js
          node --check wix/melodia-editorial.js
          node --check wix/melodia-mahou-flourish.js
          node --check wix/melodia-starfield.js
          node --check wix/curated-art-viewer.js
          node --check wix/pigment-memory.js
      - name: Token discipline (blocking)
        # BLOCKING as of 2026-09-10. This ran advisory for one day while the palette
        # naming pass was in flight; lint:tokens now reports 0 hard errors and exits 0.
        # 1309 soft warnings remain (raw rgba literals, missing --space-* tokens) but the
        # linter does not fail on those. Do not re-add continue-on-error: the point of
        # this step is that CI and `npm run verify:all` agree on what green means.
        run: node tools/lint-tokens.js
      - name: Validate portfolio (links + JSON)
        shell: pwsh
        run: ./tools/validate_portfolio.ps1
      - name: Validate recruiter showcase polish
        run: python tools/verify_showcase_polish.py
      - name: Validate recruiter sendoff freeze
        run: python tools/verify_sendoff_freeze.py

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: validate
    if: needs.validate.outputs.is_latest == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build responsive art derivatives
        run: |
          python -m pip install pillow
          python tools/build_curated_art_derivatives.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-wix:
    name: Deploy to Wix
    needs: validate
    if: needs.validate.outputs.wix_enabled == 'true' && needs.validate.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    env:
      WIX_CLI_TOKEN: ${{ secrets.WIX_CLI_TOKEN }}
      WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build responsive art derivatives
        run: |
          python -m pip install pillow
          python tools/build_curated_art_derivatives.py
      - name: Install Wix CLI
        run: npm ci
      - name: Deploy to Wix
        run: npx wix deploy --site-id $WIX_SITE_ID

  visual-qa-snapshots:
    name: Capture visual QA snapshots
    needs: validate
    if: needs.validate.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build responsive art derivatives
        run: |
          python -m pip install pillow
          python tools/build_curated_art_derivatives.py
      - name: Capture recruiter surfaces
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary available on runner"
            exit 1
          fi

          mkdir -p visual-qa
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/melodia-visual-qa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 1

          capture() {
            local width="$1"
            local height="$2"
            local output="$3"
            local route="$4"
            "$CHROME"               --headless=new               --no-sandbox               --disable-dev-shm-usage               --hide-scrollbars               --window-size="$width,$height"               --virtual-time-budget=5000               --screenshot="$PWD/visual-qa/$output"               "http://127.0.0.1:4173/$route"
          }

          capture 390 844 homepage-390.png wix/index.html
          capture 430 932 homepage-430.png wix/index.html
          capture 1440 1100 homepage-1440.png wix/index.html

          capture 390 1800 selected-art-390.png wix/curated-art.html
          capture 1440 1500 selected-art-1440.png wix/curated-art.html

          capture 390 1200 artifact-ui-390.png wix/application-hub.html#artifact-ui
          capture 1440 1100 artifact-ui-1440.png wix/application-hub.html#artifact-ui
      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-snapshots-${{ github.sha }}
          path: visual-qa/*.png
          if-no-files-found: error
          retention-days: 3
