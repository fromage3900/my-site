name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate assets & portfolio
    runs-on: ubuntu-latest
    outputs:
      wix_enabled: ${{ steps.check_wix.outputs.wix_enabled }}
      is_latest: ${{ steps.check_latest.outputs.is_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check whether this run is current main
        id: check_latest
        shell: bash
        run: |
          git fetch origin main --quiet
          latest="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" = "$latest" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Stale run: $GITHUB_SHA; current main: $latest"
          fi
      - name: Check Wix token availability
        id: check_wix
        run: |
          if [ -n "$WIX_TOKEN" ]; then
            echo "wix_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "wix_enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          WIX_TOKEN: ${{ secrets.WIX_CLI_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build responsive art derivatives
        run: |
          python -m pip install pillow
          python tools/build_curated_art_derivatives.py
      - name: Validate assets (tiered)
        run: python tools/validate_assets.py
      - name: Validate core JavaScript syntax
        run: |
          node --check wix/wix-entry-bootstrap.js\n          node --check wix/melodia-site-nav.js
          node --check wix/melodia-editorial.js
          node --check wix/melodia-mahou-flourish.js
          node --check wix/melodia-starfield.js
          node --check wix/curated-art-viewer.js
          node --check wix/pigment-memory.js
      - name: Validate portfolio (links + JSON)
        shell: pwsh
        run: ./tools/validate_portfolio.ps1

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: validate
    if: needs.validate.outputs.is_latest == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build responsive art derivatives
        run: |
          python -m pip install pillow
          python tools/build_curated_art_derivatives.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-wix:
    name: Deploy to Wix
    needs: validate
    if: needs.validate.outputs.wix_enabled == 'true' && needs.validate.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    env:
      WIX_CLI_TOKEN: ${{ secrets.WIX_CLI_TOKEN }}
      WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build responsive art derivatives
        run: |
          python -m pip install pillow
          python tools/build_curated_art_derivatives.py
      - name: Install Wix CLI
        run: npm ci
      - name: Deploy to Wix
        run: npx wix deploy --site-id $WIX_SITE_ID