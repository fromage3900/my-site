<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090714; }
  body { font-family: Georgia, 'Times New Roman', serif; }

  #breathe-stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 50%, rgba(139, 126, 190, .08), transparent 34%),
      linear-gradient(180deg, #090714 0%, #0c0918 100%);
    opacity: 1;
    transition: opacity 1s ease;
  }

  #breathe-stage.is-leaving { opacity: 0; }

  #breathe-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .breathe-word {
    position: relative;
    z-index: 2;
    margin: 0;
    color: rgba(247, 240, 255, .88);
    font-size: clamp(1rem, 1.5vw, 1.35rem);
    font-weight: 400;
    letter-spacing: .42em;
    text-transform: lowercase;
    text-indent: .42em;
    text-shadow: 0 0 24px rgba(175, 154, 226, .2);
    animation: breatheWord 3.6s ease-in-out infinite;
    user-select: none;
  }

  .skip,
  .selected-art {
    position: fixed;
    bottom: 18px;
    z-index: 3;
    border: 0;
    padding: 8px;
    color: rgba(235, 228, 245, .34);
    background: transparent;
    font: 10px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .16em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
  }
  .skip { right: 20px; }
  .selected-art { left: 20px; }
  .skip:hover, .skip:focus-visible,
  .selected-art:hover, .selected-art:focus-visible { color: rgba(247, 240, 255, .72); outline: none; }

  @keyframes breatheWord {
    0%, 100% { opacity: .42; transform: scale(.985); filter: blur(.15px); }
    50% { opacity: .96; transform: scale(1.015); filter: blur(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .breathe-word { animation: none; opacity: .9; }
  }
</style>
</head>
<body>
<main id="breathe-stage" aria-label="Melodia introduction">
  <div id="breathe-canvas" aria-hidden="true"></div>
  <p class="breathe-word">breathe</p>
  <a class="selected-art" href="wix/curated-art.html">selected art</a>
  <button class="skip" type="button" aria-label="Skip introduction">enter</button>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var destination = 'wix/index.html';
  var stage = document.getElementById('breathe-stage');
  var mount = document.getElementById('breathe-canvas');
  var skip = document.querySelector('.skip');
  var leaving = false;

  function enterPortfolio() {
    if (leaving) return;
    leaving = true;
    try { window.sessionStorage.setItem('melodia.entryCutscene.v1', 'seen'); } catch (e) {}
    stage.classList.add('is-leaving');
    window.setTimeout(function () { window.location.href = destination; }, 850);
  }

  skip.addEventListener('click', enterPortfolio);
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === 'Escape' || event.key === ' ') enterPortfolio();
  });

  window.setTimeout(enterPortfolio, 3600);

  if (!window.THREE || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.z = 8;

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'low-power' });
  } catch (e) {
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  mount.appendChild(renderer.domElement);

  var count = 180;
  var positions = new Float32Array(count * 3);
  for (var i = 0; i < count; i++) {
    var r = 1.4 + Math.random() * 5.4;
    var a = Math.random() * Math.PI * 2;
    positions[i * 3] = Math.cos(a) * r;
    positions[i * 3 + 1] = (Math.random() - .5) * 4.8;
    positions[i * 3 + 2] = (Math.random() - .5) * 3;
  }

  var geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  var material = new THREE.PointsMaterial({
    color: 0xc8b6ef,
    size: 0.035,
    transparent: true,
    opacity: 0.38,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  var particles = new THREE.Points(geometry, material);
  scene.add(particles);

  var clock = new THREE.Clock();
  function animate() {
    if (!renderer || leaving) return;
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();
    var breath = (Math.sin(t * 1.45) + 1) * 0.5;
    particles.rotation.z = t * 0.012;
    particles.rotation.y = Math.sin(t * 0.18) * 0.045;
    particles.scale.setScalar(0.985 + breath * 0.035);
    material.opacity = 0.22 + breath * 0.24;
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
